apiVersion: v1
kind: Pod
metadata:
  name: inference-perf-doe
  namespace: llm-d-pd-calibration
  labels:
    epp-opt-calibration-client: "true"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
  containers:
    - name: client
      image: quay.io/inference-perf/inference-perf@sha256:d247e6ad725dc5bb56df71d115abc8ca455bba9f0ccd4110e14bbb56504250ec
      imagePullPolicy: IfNotPresent
      command: [python, -c, "import time; time.sleep(86400)"]
      workingDir: /work
      env:
        - name: HF_HOME
          value: /work/hf
        - name: HF_HUB_OFFLINE
          value: "1"
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
