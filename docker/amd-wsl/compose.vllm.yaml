name: amd-wsl-vllm
services:
  vllm:
    image: llm-serving/vllm-wsl:0.33.0-rocm100
    build:
      context: .
      dockerfile: Dockerfile.vllm-wsl
    restart: unless-stopped
    shm_size: 2gb
    devices:
      - /dev/dxg:/dev/dxg
    env_file:
      - /srv/llm-serving/config/vllm-service.env
    environment:
      HSA_ENABLE_DXG_DETECTION: "1"
      ROCPROFILER_REGISTER_ENABLED: "0"
      LLM_SERVING_WSL_ROCM: "1"
      VLLM_PLUGINS: llm_serving_wsl_rocm
      ROCR_VISIBLE_DEVICES: ${ROCR_VISIBLE_DEVICES:?Set the AMD GPU identifier}
      LD_LIBRARY_PATH: /srv/llm-serving/rocm100-wsl-host-bridge:/srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_core/lib:/srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_libraries/lib:/usr/lib/wsl/lib
      ROCM_PATH: /srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_devel
      ROCM_HOME: /srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_devel
      HIP_PATH: /srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_devel
      VLLM_USE_TRITON_AWQ: "1"
      VLLM_ROCM_USE_AITER: "0"
      HF_HOME: /cache/huggingface
      VLLM_CACHE_ROOT: /cache/vllm
      TRITON_CACHE_DIR: /cache/triton
      HF_HUB_OFFLINE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /srv/llm-serving/venvs/vllm-rocm100-v033:/srv/llm-serving/venvs/vllm-rocm100-v033:ro
      - /srv/llm-serving/models:/models:ro
      - /srv/llm-serving/cache-v033:/cache
      - /srv/llm-serving/rocm100-wsl-host-bridge:/srv/llm-serving/rocm100-wsl-host-bridge:ro
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - /usr/lib/wsl/lib/libdxcore.so:/usr/lib/libdxcore.so:ro
      - /opt/rocm/lib/librocdxg.so:/usr/lib/librocdxg.so:ro
      - /opt/rocm/share/rocdxg/dids.conf:/usr/share/rocdxg/dids.conf:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 120s
