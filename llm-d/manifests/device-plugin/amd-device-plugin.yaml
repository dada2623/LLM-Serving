apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin-daemonset
  namespace: kube-system
  labels:
    app.kubernetes.io/name: amdgpu-device-plugin
    app.kubernetes.io/part-of: llm-d-serving
spec:
  selector:
    matchLabels:
      name: amdgpu-dp-ds
  template:
    metadata:
      labels:
        name: amdgpu-dp-ds
    spec:
      nodeSelector:
        llm-d.ai/gpu-vendor: amd
      restartPolicy: Always
      priorityClassName: system-node-critical
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      initContainers:
        - name: amdgpu-dp-init-cntr
          image: busybox:1.37
          command:
            - sh
            - -c
            - while [ ! -d /sys/class/kfd ] || [ ! -d /sys/module/amdgpu/drivers/ ]; do echo "amdgpu driver is not loaded"; sleep 2; done
          securityContext:
            privileged: true
          volumeMounts:
            - name: sys
              mountPath: /sys
      containers:
        - image: rocm/k8s-device-plugin
          name: amdgpu-dp-cntr
          command:
            - ./k8s-device-plugin
          args:
            - -resource_naming_strategy=product
            - -logtostderr=true
            - -stderrthreshold=INFO
            - -v=5
          securityContext:
            privileged: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dp
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
      volumes:
        - name: dp
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
