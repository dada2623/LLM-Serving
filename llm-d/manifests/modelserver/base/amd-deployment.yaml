apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-amd
  labels:
    llm-d.ai/guide: llm-serving
    llm-d.ai/model-server: vllm
    llm-d.ai/model: qwen3-0.6b
    llm-d.ai/accelerator-vendor: amd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-amd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-amd
        llm-d.ai/guide: llm-serving
        llm-d.ai/model-server: vllm
        llm-d.ai/model: qwen3-0.6b
        llm-d.ai/accelerator-vendor: amd
    spec:
      serviceAccountName: llm-d-modelserver
      nodeSelector:
        llm-d.ai/gpu-vendor: amd
      containers:
        - name: modelserver
          image: docker.io/vllm/vllm-openai-rocm:v0.33.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - /models/Qwen3-0.6B
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --served-model-name
            - Qwen3-0.6B
            - --dtype
            - auto
            - --max-model-len
            - "4096"
            - --max-num-seqs
            - "8"
            - --max-num-batched-tokens
            - "2048"
            - --gpu-memory-utilization
            - "0.70"
            - --enforce-eager
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: PATH
              value: /srv/llm-serving/venvs/vllm-rocm100-v033/bin:/opt/rocm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: LD_LIBRARY_PATH
              value: /srv/llm-serving/pd-runtime/ucx-1.23.2-rocm100/lib:/srv/llm-serving/pd-runtime/nixl-1.5.0-rocm/lib:/srv/llm-serving/compat/lib:/srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_core/lib:/srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_libraries/lib:/opt/rocm/lib
            - name: ROCM_PATH
              value: /srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_devel
            - name: ROCM_HOME
              value: /srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_devel
            - name: HIP_PATH
              value: /srv/llm-serving/venvs/vllm-rocm100-v033/lib/python3.12/site-packages/_rocm_sdk_devel
            - name: PYTHONPATH
              value: /srv/llm-serving/pd-runtime/nixl-1.5.0-rocm/lib/python3/dist-packages
            - name: NIXL_PLUGIN_DIR
              value: /srv/llm-serving/pd-runtime/nixl-1.5.0-rocm/lib/plugins
            - name: LD_PRELOAD
              value: /srv/llm-serving/pd-runtime/ucx-1.23.2-rocm100/lib/libucs.so.0:/srv/llm-serving/pd-runtime/ucx-1.23.2-rocm100/lib/libucp.so.0:/srv/llm-serving/pd-runtime/ucx-1.23.2-rocm100/lib/libuct.so.0
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              amd.com/gpu-rx-7800-xt: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              amd.com/gpu-rx-7800-xt: "1"
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: rocm
              mountPath: /opt/rocm
              readOnly: true
            - name: runtime-compat
              mountPath: /srv/llm-serving/compat
              readOnly: true
            - name: vllm-runtime
              mountPath: /srv/llm-serving/venvs/vllm-rocm100-v033
              readOnly: true
            - name: nixl-runtime
              mountPath: /srv/llm-serving/pd-runtime/nixl-1.5.0-rocm
              readOnly: true
            - name: ucx-runtime
              mountPath: /srv/llm-serving/pd-runtime/ucx-1.23.2-rocm100
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          hostPath:
            path: /srv/llm-serving/models
            type: Directory
        - name: rocm
          hostPath:
            path: /opt/rocm
            type: Directory
        - name: runtime-compat
          hostPath:
            path: /srv/llm-serving/amd-runtime/compat
            type: Directory
        - name: vllm-runtime
          hostPath:
            path: /srv/llm-serving/amd-runtime/venvs/vllm-rocm100-v033
            type: Directory
        - name: nixl-runtime
          hostPath:
            path: /srv/llm-serving/amd-runtime/pd-runtime/nixl-1.5.0-rocm
            type: Directory
        - name: ucx-runtime
          hostPath:
            path: /srv/llm-serving/amd-runtime/pd-runtime/ucx-1.23.2-rocm100
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
