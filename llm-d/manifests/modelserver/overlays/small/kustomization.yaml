apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: patch-nixl-pd.yaml
    target:
      kind: Deployment
      name: vllm-(amd|nvidia)
  - path: patch-amd-ucx.yaml
    target:
      kind: Deployment
      name: vllm-amd
  - path: patch-nvidia-ucx.yaml
    target:
      kind: Deployment
      name: vllm-nvidia
