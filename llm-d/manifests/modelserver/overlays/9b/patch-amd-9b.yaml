apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-amd
spec:
  template:
    metadata:
      labels:
        llm-d.ai/model: qwen3.5-9b-awq
    spec:
      containers:
        - name: modelserver
          args:
            - /models/Qwen3.5-9B-AWQ
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --served-model-name
            - Qwen3.5-9B-AWQ
            - --dtype
            - float16
            - --quantization
            - awq
            - --max-model-len
            - "16384"
            - --max-num-seqs
            - "1"
            - --max-num-batched-tokens
            - "512"
            - --gpu-memory-utilization
            - "0.80"
            - --enforce-eager
            - --language-model-only
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 24Gi

      volumes:
        - name: models
          hostPath:
            path: /srv/llm-serving/models
            type: Directory
